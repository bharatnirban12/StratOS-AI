name: stratos-ai
services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    command: >
      bash -c "
        echo 'Waiting for Zookeeper...' &&
        sleep 20 &&
        /etc/confluent/docker/run
      "

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  agent-service:
    build:
      context: .
      dockerfile: agent_service/Dockerfile
    depends_on:
      - kafka
      - redis
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    env_file:
      - .env

  orchestrator:
    build: 
      context: .
      dockerfile: orchestrator/Dockerfile
    depends_on:
      - kafka
      - redis
    volumes:
      - .:/app
    env_file:
      - .env

  api-gateway:
    build:
      context: .
      dockerfile: api_gateway/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - kafka
    volumes:
      - .:/app
    env_file:
      - .env

  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"    

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-stratos_ai}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./result_service/schema.sql:/docker-entrypoint-initdb.d/init.sql

  streamlit:
    build:
      context: .
      dockerfile: streamlit/Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      - api-gateway
    env_file:
      - .env
    